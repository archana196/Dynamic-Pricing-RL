<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Dynamic Pricing RL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🤖 Dynamic Pricing RL</a>
            <a href="/" class="btn btn-outline-light">Home</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>📊 Pricing Dashboard</h2>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card text-white bg-success shadow p-3">
                    <h5>💰 Revenue</h5>
                    <h2>₹{{ data.revenue }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-primary shadow p-3">
                    <h5>📦 Inventory</h5>
                    <h2>{{ data.inventory }}</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning shadow p-3">
                    <h5>🏷️ Recommended Price</h5>
                    <h2>₹{{ data.recommended_price }}</h2>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
