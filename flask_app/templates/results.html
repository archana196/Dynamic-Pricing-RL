<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Dynamic Pricing RL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🤖 Dynamic Pricing RL</a>
            <a href="/dashboard" class="btn btn-outline-light">Dashboard</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>🎯 Pricing Results</h2>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h4>Recommended Price</h4>
                    <h1 class="text-success">₹{{ data.recommended_price }}</h1>
                    <p class="text-muted">AI optimized price</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h4>Inventory Status</h4>
                    <h1 class="text-primary">{{ data.inventory }}</h1>
                    <p class="text-muted">{{ data.days_remaining }} days remaining</p>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card shadow p-4">
                    <h4>Total Revenue</h4>
                    <h1 class="text-warning">₹{{ data.revenue }}</h1>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
